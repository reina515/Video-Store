<!DOCTYPE html>
<html>
<head>
    <title>{% if form.instance.pk %}Update Video{% else %}Add New Video{% endif %}</title>
</head>
<body>
    <h1>{% if form.instance.pk %}Update Video{% else %}Add New Video{% endif %}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save</button>
    </form>
    <br>
    <a href="{% url 'video_list' %}">Back to Video List</a> |
    <a href="{% url 'index' %}">Back to Dashboard</a>
</body>
</html>
